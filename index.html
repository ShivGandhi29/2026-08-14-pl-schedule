<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PL Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>PL Schedule</h1>
    <div class="view-toggle" role="tablist">
      <button id="tab-fixtures" class="tab active" role="tab" aria-selected="true">Fixtures</button>
      <button id="tab-teams" class="tab" role="tab" aria-selected="false">My Teams</button>
    </div>
  </header>

  <main>
    <section id="view-fixtures" class="view active">
      <div class="filter-bar" role="group" aria-label="Fixture filter">
        <button id="filter-all" class="filter-chip active">All Fixtures</button>
        <button id="filter-mine" class="filter-chip">My Teams</button>
      </div>
      <div id="fixture-list" class="fixture-list"></div>
      <div id="empty-state" class="empty-state" hidden>
        <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 17.3 6.2 21l1.6-6.6L2.5 10l6.7-.6L12 3.3l2.8 6.1 6.7.6-5.3 4.4 1.6 6.6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
        </svg>
        <p>No favourite teams selected yet.<br />Go to &ldquo;My Teams&rdquo; to pick some.</p>
      </div>
    </section>

    <section id="view-teams" class="view">
      <p class="section-hint">Tap a team to add it to your favourites.</p>
      <div id="team-grid" class="team-grid"></div>
    </section>
  </main>

  <script src="data/fixtures.js"></script>
  <script src="app.js"></script>
</body>
</html>
